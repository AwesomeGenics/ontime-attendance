{% extends "base.html" %}

{% block title %}Log In | OnTime{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="auth-container">
  <div class="auth-ledger-card">
    
    <div class="auth-header">
      <div class="auth-brand-seal">O</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in and check if you can afford to skip today's classes.</p>
    </div>

    <!-- Segmented Control -->
    <div class="auth-segmented-switch">
      <span class="auth-switch-item active">Sign In</span>
      <a href="/register" class="auth-switch-item">Register</a>
    </div>

    <form action="/login" method="post" id="login-form">
      <div class="input-ledger-group">
        <label class="input-ledger-label" for="username">Username</label>
        <div class="field-with-icon">
          <svg class="lead-icon" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input 
            type="text" 
            name="username" 
            id="username" 
            class="text-input-ledger" 
            placeholder="Your username" 
            value="{{ un or '' }}" 
            required 
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="input-ledger-group" style="margin-bottom: 24px;">
        <label class="input-ledger-label" for="password">Password</label>
        <div class="field-with-icon">
          <svg class="lead-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input 
            type="password" 
            name="password" 
            id="password" 
            class="text-input-ledger" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
          <button 
            type="button" 
            class="toggle-eye-btn" 
            onclick="togglePasswordVisibility('password', this)"
            title="Toggle visibility"
          >
            <svg class="eye-icon" viewBox="0 0 24 24" style="width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" style="display: none; width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-ledger-block">
        Let Me In
      </button>
    </form>

    <div class="auth-bottom-notes">
      <span>New here? </span>
      <a href="/register" class="auth-highlight-link">Create an account</a>
    </div>

  </div>
</div>
{% endblock %}
